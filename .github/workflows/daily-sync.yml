name: Daily Snapshot Sync

on:
  schedule:
    # 每天 23:25 UTC = 北京时间次日 07:25
    - cron: '25 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build snapshot
        run: python tools/build_snapshot.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: daily snapshot sync [skip ci]"
            git push
          fi
