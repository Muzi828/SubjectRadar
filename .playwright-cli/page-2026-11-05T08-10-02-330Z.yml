      - generic [ref=f1e1466]: 摘要
      - paragraph [ref=f1e1468]: 为精准分析消防员体力疲劳状态,降低训练损伤风险、提升应急救援效能,首先,以 18 名消防员为研究对象,通过日常训练诱导体力疲劳,结合主观问卷得分与时间感知平均相对误差验证疲劳诱导有效性;然后,采集疲劳前后心率变异性(HRV)、眼动、皮电、肌电4类生理指标,经功效分析、t 检验、秩和检验及BH矫正筛选显著差异指标,并采用最小冗余最大相关(mRMR)算法,完成核心特征优选;最后,基于多模态融合策略构建单、双、三、四模态疲劳状态分析模型,并采用逻辑回归(LR)、K近邻(KNN)、支持向量机(SVM)、自适应提升(AB)、随机森林(RF)5种机器学习算法,开展分析验证。结果表明:心率变异性(HRV)为最优单模态分析指标;多模态融合分析效果显著优于单一模态,肌电、HRV、眼动三模态为最佳融合组合;逻辑回归模型识别准确率达91.4%、平均准确率为88.7%,可高效精准判定消防员体力疲劳状态。
